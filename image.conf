# ============================================================
# 镜像配置：改这里就够了
# ============================================================

# 镜像仓库与标签
IMAGE_REPO=xct258/my-image
IMAGE_TAG=latest

# 基础镜像（需带 tag）
BASE_IMAGE=xct258/debian-cn:latest

# 多架构构建时使用（--push 生效）
PLATFORMS=linux/amd64,linux/arm64

# 容器名与端口（端口留空表示不映射）
CONTAINER_NAME=my-image
PORT=
