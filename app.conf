#!/bin/bash
# ============================================================
# 配置文件：只需修改本文件
#   构建配置（CI 读取）   ：镜像名 / 标签 / 架构
#   应用配置（模板读取） ：依赖安装 / 启动命令
# ============================================================

# ------------------------------------------------------------
# 1. 构建配置：镜像仓库与标签（推送到 Docker Hub）
# ------------------------------------------------------------
IMAGE_REPO=xct258/my-image
IMAGE_TAG=latest

# 构建架构
PLATFORMS=linux/amd64,linux/arm64

# ------------------------------------------------------------
# 2. 系统依赖：apt 包名，空格分隔
# ------------------------------------------------------------
APT_PACKAGES="ca-certificates curl"

# ------------------------------------------------------------
# 3. 自定义安装命令（构建时执行一次）
#    适用于 apt 装不了的东西：下载二进制、编译安装等
#    一条一个，用双引号包住；不需要就留空数组
#    按架构区分时可引用 ${TARGETARCH}（amd64 / arm64）
# ------------------------------------------------------------
CUSTOM_INSTALL=(
  # "curl -fsSL -o /usr/local/bin/foo https://example.com/foo"
  # "chmod +x /usr/local/bin/foo"
)

# ------------------------------------------------------------
# 4. 启动前的准备命令（容器每次启动时执行，可选）
# ------------------------------------------------------------
START_PREPARE=(
  # "mkdir -p /var/log/app"
)

# ------------------------------------------------------------
# 5. 启动命令（前台运行，即容器主进程）
#    最后一个必须是常驻进程，docker stop 才能优雅退出
# ------------------------------------------------------------
START_CMD="sleep infinity"
