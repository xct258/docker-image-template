#!/bin/bash
# ============================================================
# 配置文件：只需修改本文件
#   构建配置（CI 读取）   ：镜像名 / 标签 / 架构
#   应用配置（模板读取） ：依赖安装 / 启动命令
# ============================================================

# ------------------------------------------------------------
# 1. 构建配置：镜像仓库与标签（推送到 Docker Hub）
# ------------------------------------------------------------
IMAGE_REPO=xct258/my-image
IMAGE_TAG=latest

# 构建架构
PLATFORMS=linux/amd64,linux/arm64

# ------------------------------------------------------------
# 2. 系统依赖（apt）：一行一个
# ------------------------------------------------------------
APT_PACKAGES=(
  ca-certificates
  curl
)

# ------------------------------------------------------------
# 3. 常用软件快捷开关（true / false）
#    开启后自动从官方发布下载安装（无需 apt）
# ------------------------------------------------------------
INSTALL_7Z=false

# ------------------------------------------------------------
# 4. Python 依赖（pip 包）：一行一个
#    非空时会自动安装 Python3，再用 pip 安装这些包
# ------------------------------------------------------------
PYTHON_PACKAGES=(
  # requests
  # flask
)

# ------------------------------------------------------------
# 5. 自定义安装脚本（构建时执行一次）
#    适用于 apt / pip 装不了的东西：下载二进制、编译安装等
#    具体命令写在仓库根目录的 custom-install.sh 里
#    该脚本内可用 ${TARGETARCH} 区分架构（amd64 / arm64）
# ------------------------------------------------------------
INSTALL_CUSTOM=true

# ------------------------------------------------------------
# 6. 启动前的准备命令（容器每次启动时执行，可选）
# ------------------------------------------------------------
START_PREPARE=(
  # "mkdir -p /var/log/app"
)

# ------------------------------------------------------------
# 7. 启动命令（前台运行，即容器主进程）
#    最后一个必须是常驻进程，docker stop 才能优雅退出
# ------------------------------------------------------------
START_CMD="sleep infinity"
