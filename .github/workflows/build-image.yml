# ============================================================
# 构建镜像并推送 Docker Hub
#   配置来源: image.conf（IMAGE_REPO / IMAGE_TAG / PLATFORMS）
#   触发方式: 仅手动（Actions 页面 → Run workflow）
#   每次推送三个标签: <repo>:<tag>  <repo>:latest  <repo>:sha-<7位提交号>
#   所需 Secrets: DOCKERACC（账号）/ DOCKERPWD（密码或 Access Token）
# ============================================================
name: Build and Push Docker Image

on:
  workflow_dispatch:

concurrency:
  group: image-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 读取 image.conf，输出到 GITHUB_OUTPUT 供后续步骤使用
      # ------------------------------------------------------------
      - name: Read image.conf
        id: conf
        run: |
          set -euo pipefail
          source image.conf
          {
            echo "image_repo=${IMAGE_REPO:-xct258/my-image}"
            echo "image_tag=${IMAGE_TAG:-latest}"
            echo "platforms=${PLATFORMS:-linux/amd64}"
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 多架构构建准备：QEMU 模拟 + buildx
      # ------------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERACC }}
          password: ${{ secrets.DOCKERPWD }}

      # ------------------------------------------------------------
      # 由当前提交生成 sha-<7位> 标签
      # ------------------------------------------------------------
      - name: Generate sha tag
        id: tags
        run: |
          sha="${{ github.sha }}"
          echo "sha_tag=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ steps.conf.outputs.platforms }}
          build-args: |
            REPO_URL=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
          tags: |
            ${{ steps.conf.outputs.image_repo }}:${{ steps.conf.outputs.image_tag }}
            ${{ steps.conf.outputs.image_repo }}:latest
            ${{ steps.conf.outputs.image_repo }}:sha-${{ steps.tags.outputs.sha_tag }}
          # 启用 GitHub Actions 缓存，加速定时重建
          cache-from: type=gha
          cache-to: type=gha,mode=max
