# ============================================================
# 构建镜像并推送 Docker Hub
#   配置来源: app.conf（唯一配置文件）
#   触发方式: 仅手动（Actions 页面 → Run workflow）
#   每次推送三个标签: <repo>:<tag>  <repo>:latest  <repo>:sha-<7位提交号>
#   所需 Secrets: DOCKERACC（账号）/ DOCKERPWD（密码或 Access Token）
# ============================================================
name: Build and Push Docker Image

on:
  workflow_dispatch:

concurrency:
  group: image-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # 构建前校验：必备文件 + 配置文件语法
      # ------------------------------------------------------------
      - name: Validate config files
        run: |
          set -euo pipefail
          # 1) 必备文件（构建时需从仓库下载）
          for f in app.conf template/install.sh template/start.sh template/Dockerfile; do
            [ -f "$f" ] || { echo "错误：仓库缺少 ${f}" >&2; exit 1; }
          done
          # 2) 脚本语法
          bash -n app.conf template/install.sh template/start.sh
          # 3) 配置可正常 source（无语法/格式错误），并检查必填项
          source app.conf
          [ -n "${IMAGE_REPO:-}" ] || { echo "错误：app.conf 缺少 IMAGE_REPO" >&2; exit 1; }
          [ -n "${PLATFORMS:-}" ] || { echo "错误：app.conf 缺少 PLATFORMS" >&2; exit 1; }
          # 4) 启用自定义安装时，脚本必须存在且语法正确
          if [ "${INSTALL_CUSTOM:-false}" = "true" ]; then
            [ -f custom-install.sh ] || { echo "错误：INSTALL_CUSTOM=true，但仓库缺少 custom-install.sh" >&2; exit 1; }
            bash -n custom-install.sh
          fi
          echo "app.conf 校验通过"

      # ------------------------------------------------------------
      # 读取 app.conf，输出到 GITHUB_OUTPUT 供后续步骤使用
      # ------------------------------------------------------------
      - name: Read app.conf
        id: conf
        run: |
          set -euo pipefail
          source app.conf
          {
            echo "image_repo=${IMAGE_REPO:-xct258/my-image}"
            echo "image_tag=${IMAGE_TAG:-latest}"
            echo "platforms=${PLATFORMS:-linux/amd64}"
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 检查 Docker Hub 凭据是否已配置（未配置时给出明确提示）
      # ------------------------------------------------------------
      - name: Check Docker Hub secrets
        env:
          DOCKERACC: ${{ secrets.DOCKERACC }}
          DOCKERPWD: ${{ secrets.DOCKERPWD }}
        run: |
          [ -n "${DOCKERACC:-}" ] || { echo "错误：未配置 Secrets → DOCKERACC" >&2; exit 1; }
          [ -n "${DOCKERPWD:-}" ] || { echo "错误：未配置 Secrets → DOCKERPWD" >&2; exit 1; }
          echo "Secrets 校验通过"

      # ------------------------------------------------------------
      # 多架构构建准备：QEMU 模拟 + buildx
      # ------------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERACC }}
          password: ${{ secrets.DOCKERPWD }}

      # ------------------------------------------------------------
      # 由当前提交生成 sha-<7位> 标签
      # ------------------------------------------------------------
      - name: Generate sha tag
        id: tags
        run: |
          sha="${{ github.sha }}"
          echo "sha_tag=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: template/Dockerfile
          push: true
          # 不使用任何构建缓存，每次构建全新执行，保证下载最新文件
          no-cache: true
          platforms: ${{ steps.conf.outputs.platforms }}
          build-args: |
            REPO_URL=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
          tags: |
            ${{ steps.conf.outputs.image_repo }}:${{ steps.conf.outputs.image_tag }}
            ${{ steps.conf.outputs.image_repo }}:latest
            ${{ steps.conf.outputs.image_repo }}:sha-${{ steps.tags.outputs.sha_tag }}
